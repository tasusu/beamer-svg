[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "beamerweb"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["Jinja2>=3.1"]
description = "Present Beamer slides as interactive inline SVG"

[project.scripts]
beamerweb = "beamerweb.cli:main"

[tool.setuptools]
packages = ["beamerweb"]

[tool.setuptools.package-data]
beamerweb = ["runtime/*", "tex/*", "templates/*.j2"]
